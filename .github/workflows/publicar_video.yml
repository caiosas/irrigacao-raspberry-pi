name: Publicar vídeo demonstrativo completo

on:
  push:
    paths:
      - ".github/workflows/publicar_video.yml"
      - "docs/media/reconstruir_video.py"
      - "docs/media/video_original_partes/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Reconstituir e validar vídeo original
        run: python3 docs/media/reconstruir_video.py
      - name: Criar release e enviar MP4 original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view demonstracao-irrigacao-v1 >/dev/null 2>&1 || \
            gh release create demonstracao-irrigacao-v1 --target "$GITHUB_SHA" \
              --title "Demonstração do sistema de irrigação" \
              --notes "Vídeo completo da montagem, do painel e do acesso remoto por Tailscale. Arquivo original com áudio, sem reencodificação."
          gh release upload demonstracao-irrigacao-v1 docs/media/demonstracao_completa.mp4 --clobber
